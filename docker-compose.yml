# Whole stack: web app on http://localhost:3000, graph service on :8000.
services:
  graph:
    build: ./services/graph
    environment:
      GRAPH_API_KEY: ${GRAPH_API_KEY:-dev-key}
    # Published on localhost only: the service is meant to be reached by the web app, not the network.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  web:
    build: ./apps/web
    environment:
      GRAPH_SERVICE_URL: http://graph:8000
      GRAPH_API_KEY: ${GRAPH_API_KEY:-dev-key}
    ports:
      - "3000:3000"
    depends_on:
      graph:
        condition: service_healthy
