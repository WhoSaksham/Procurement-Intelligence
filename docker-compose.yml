# Whole stack: web on http://localhost:3000; API on :4000, graph service on :8000
# and MongoDB on :27017 are published on localhost only.
services:
  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      MONGO_URL: mongodb://mongo:27017/procurement
      API_KEY: ${API_KEY:-dev-key}
      GRAPH_SERVICE_URL: http://graph:8000
      GRAPH_API_KEY: ${GRAPH_API_KEY:-dev-key}
      E2E: ${E2E:-}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      mongo:
        condition: service_healthy

  graph:
    build: ./services/graph
    environment:
      GRAPH_API_KEY: ${GRAPH_API_KEY:-dev-key}
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: procurement
    ports:
      - "127.0.0.1:8000:8000"
    # The API seeds the graph collections before it reports healthy.
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./apps/web
    environment:
      API_URL: http://api:4000
      API_KEY: ${API_KEY:-dev-key}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:
