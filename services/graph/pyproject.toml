[project]
name = "procurement-graph"
version = "0.1.0"
description = "Procurement knowledge graph service built on Semantica"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.163.1",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "pymongo==4.20.0",
    "semantica==0.7.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<0.29",
    "mongomock==4.3.0",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
