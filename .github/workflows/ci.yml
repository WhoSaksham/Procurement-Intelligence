name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · lint, types, tests, contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: OpenAPI document is up to date
        run: npm run openapi -- --check
      - name: Graph service test fixture is up to date
        run: npm run export:graph-seed -- --check

  web:
    name: Web · lint, types, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  graph:
    name: Graph service · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/graph
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.8
      - run: uv sync --frozen
      - run: uv run pytest -q

  e2e:
    name: End-to-end · Playwright
    needs: [api, web, graph]
    runs-on: ubuntu-latest
    env:
      API_KEY: ci-key
      GRAPH_API_KEY: ci-graph-key
      E2E: '1'
      API_EXTERNAL: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Start MongoDB, the API and the graph service
        run: docker compose up -d --build --wait mongo api graph
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test
        working-directory: apps/web
      - name: Hydration check against next dev
        run: npm run test:e2e:dev
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - name: Service logs
        if: failure()
        run: docker compose logs api graph
